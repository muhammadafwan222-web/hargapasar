<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantau Harga - Hulu Sungai Utara</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --bg: #f8fafc;
            --text: #334155;
            --card: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .status {
            font-size: 0.9em;
            color: #64748b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .search-bar {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            background: var(--card);
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: var(--primary); color: white; }
        .price-up { color: var(--danger); font-weight: bold; }
        .price-down { color: var(--success); font-weight: bold; }
        .price-stable { color: #64748b; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Info Harga Pasar - Hulu Sungai Utara, Hulu Sungai Selatan, Hulu Sungai Tengah </h1>
        <div class="status">
            <div class="live-indicator"></div>
            <span id="last-update">Menunggu pembaruan data...</span>
        </div>
    </header>

    <input type="text" id="searchInput" class="search-bar" placeholder="Cari barang (misal: Beras, Telur)..." onkeyup="filterTabel()">

    <table id="priceTable">
        <thead>
            <tr>
                <th>Komoditas</th>
                <th>Harga Saat Ini (Rp)</th>
                <th>Status / Trend</th>
                <th>Sumber</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data akan dimuat otomatis dari data_harga.json -->
        </tbody>
    </table>
</div>

<script>
    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(angka);
    };

    function fetchRealtimeData() {
        fetch('data_harga.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Gagal mengambil file data_harga.json');
                }
                return response.json();
            })
            .then(data => {
                renderTabel(data);
                updateWaktu();
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("last-update").innerText = "Gagal memuat data harga.";
            });
    }

    function renderTabel(data) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Belum ada data harga.</td></tr>";
            return;
        }

        data.forEach(item => {
            let trendIcon = "— Tetap";
            let trendClass = "price-stable";
            
            if (item.trend === "up") {
                trendIcon = "▲ Naik";
                trendClass = "price-up";
            } else if (item.trend === "down") {
                trendIcon = "▼ Turun";
                trendClass = "price-down";
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${item.nama}</strong></td>
                <td>Rp ${formatRupiah(item.harga)}</td>
                <td class="${trendClass}">${trendIcon}</td>
                <td style="font-size: 0.85em; color: #64748b;">${item.sumber}</td>
            `;
            tbody.appendChild(tr);
        });

        filterTabel();
    }

    function filterTabel() {
        const input = document.getElementById("searchInput").value.toUpperCase();
        const trs = document.getElementById("tableBody").getElementsByTagName("tr");

        for (let i = 0; i < trs.length; i++) {
            const tdKomoditas = trs[i].getElementsByTagName("td")[0];
            if (tdKomoditas) {
                const txtValue = tdKomoditas.textContent || tdKomoditas.innerText;
                if (txtValue.toUpperCase().indexOf(input) > -1) {
                    trs[i].style.display = "";
                } else {
                    trs[i].style.display = "none";
                }
            }
        }
    }

    function updateWaktu() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('id-ID');
        document.getElementById("last-update").innerText = "Update terakhir: " + timeString + " WITA";
    }

    window.onload = () => {
        fetchRealtimeData();
        setInterval(fetchRealtimeData, 30000); // Perbarui tampilan tiap 30 detik
    };
</script>

</body>
</html>
